# Publishes the online game to Cloudflare whenever main changes.
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN  - a Cloudflare API token with Workers Scripts Edit, Workers KV Storage Edit and D1 Edit
#   CLOUDFLARE_ACCOUNT_ID - the Cloudflare account id
# Until both exist this workflow runs the tests and skips the publish step.
name: Publish the game site

on:
  push:
    branches: [main]
    paths: ['game/**', 'cards/cards.json', 'rules/**', '.github/workflows/deploy-site.yml']
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/package-lock.json
      - run: npm ci
      - name: Test the rules engine and the game server
        run: npm test
      - name: Build the website
        run: npm run build
      - name: Apply stats database changes
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npm run migrate -w @divide/server
      - name: Publish
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npm run deploy:kv -w @divide/server
      - name: Note
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::notice::Tests passed. Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to publish automatically."
